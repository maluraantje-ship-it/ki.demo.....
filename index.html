<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuralCore AI</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

body {
  margin:0;
  font-family: 'Orbitron', sans-serif;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color:white;
  height:100vh;
  display:flex;
  flex-direction:column;
}

header {
  padding:20px;
  text-align:center;
  font-size:1.8em;
  letter-spacing:2px;
  background: linear-gradient(90deg,#00f5ff,#6366f1);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

#chat {
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.msg {
  padding:14px 18px;
  margin:12px 0;
  border-radius:16px;
  max-width:75%;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from {opacity:0; transform:translateY(10px);} 
  to {opacity:1; transform:translateY(0);} 
}

.user {
  margin-left:auto;
  background: linear-gradient(135deg,#2563eb,#7c3aed);
  box-shadow:0 0 10px rgba(99,102,241,0.6);
}

.bot {
  background:#111827;
  border:1px solid #1f2937;
}

footer {
  display:flex;
  gap:10px;
  padding:15px;
  background:#020617;
  border-top:1px solid #1f2937;
}

input {
  flex:1;
  padding:14px;
  border-radius:12px;
  border:none;
  background:#111827;
  color:white;
}

button {
  padding:12px 16px;
  border:none;
  border-radius:12px;
  background: linear-gradient(135deg,#00f5ff,#6366f1);
  color:black;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

button:hover {
  transform:scale(1.05);
}

.tools {
  display:flex;
  gap:10px;
  padding:10px;
  justify-content:center;
}

.panel {
  display:flex;
  justify-content:space-around;
  padding:10px;
  background:#020617;
  border-top:1px solid #1f2937;
}

.card {
  padding:10px;
  background:#111827;
  border-radius:12px;
  cursor:pointer;
  transition:0.2s;
}

.card:hover {
  background:#1f2937;
  transform:scale(1.05);
}

.glow {
  text-shadow:0 0 10px #00f5ff, 0 0 20px #6366f1;
}

</style>
</head>

<body>
<header class="glow">NEURALCORE AI</header>

<div id="chat"></div>

<div class="panel">
  <div class="card" onclick="quickPrompt('Erkläre mir etwas krasses über das Universum')">🌌 Wissen</div>
  <div class="card" onclick="createImage()">🎨 Bild</div>
  <div class="card" onclick="createPDF()">📄 PDF</div>
  <div class="card" onclick="quickPrompt('Gib mir eine Business Idee')">💡 Ideen</div>
</div>

<footer>
  <input id="input" placeholder="Sprich mit der Zukunft...">
  <button onclick="sendMessage()">→</button>
</footer>

<script>
const API_KEY = "HIER_DEIN_OPENAI_API_KEY";
const chat = document.getElementById("chat");

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "msg " + sender;
  div.innerText = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(customText=null) {
  const input = document.getElementById("input");
  const text = customText || input.value.trim();
  if(!text) return;

  addMessage(text,"user");
  input.value="";

  const res = await fetch("https://api.openai.com/v1/chat/completions",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer " + API_KEY
    },
    body: JSON.stringify({
      model:"gpt-4o-mini",
      messages:[{role:"user",content:text}]
    })
  });

  const data = await res.json();
  const reply = data.choices?.[0]?.message?.content || "Fehler";

  addMessage(reply,"bot");
}

function quickPrompt(text){ sendMessage(text); }

async function createImage() {
  const promptText = prompt("Beschreibe dein Bild");
  if(!promptText) return;

  addMessage("🎨 Generiere: " + promptText, "user");

  const res = await fetch("https://api.openai.com/v1/images/generations",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer " + API_KEY
    },
    body: JSON.stringify({ prompt: promptText, size:"1024x1024" })
  });

  const data = await res.json();
  const imgUrl = data.data?.[0]?.url;

  const img = document.createElement("img");
  img.src = imgUrl;
  img.style.maxWidth = "320px";
  img.style.borderRadius = "12px";
  img.style.margin = "10px";

  chat.appendChild(img);
}

function createPDF() {
  const content = prompt("Text für PDF");
  if(!content) return;

  const blob = new Blob([content], {type:"application/pdf"});
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "NeuralCore.pdf";
  link.click();

  addMessage("📄 PDF erstellt","bot");
}

</script>
</body>
</html>
